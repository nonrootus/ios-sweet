name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      runner:
        description: macOS build host (Intel fallback when arm64 capacity is unavailable)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # Host architecture is independent of the SWEET arm64 kernel target.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact HFI service patch
        run: |
          baseline=4a0bc2a0d09383f6134c2eda5b8669029cdce012
          if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$baseline"
          fi
          python3 tools/verify-gmu-service-patch.py "$RUNNER_TEMP/hfi-preflight"

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Verify required SWEET GPU patch in source and kernel
        if: env.MACHINE_CONFIG == 'SWEET' && env.KERNEL_CONFIG == 'DEVELOPMENT'
        run: |
          set -x
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0122-sweet-gmu-tcm-power-recheck.patch"
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0124-sweet-smmu-snapshot-probe.patch"
          # 0139 supersedes 0125 HFI bytes and 0126 table helpers; exact cmp below.
          # Later patches supersede memory/HFI sources; verify final contents.
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_memory.cpp                            optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_hfi_memory.cpp                        optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          git -C dxb/xnu apply --reverse --check --exclude=iokit/Kernel/arm/sweet_gpu_memory_probe.cpp --exclude=iokit/conf/files.arm64 "$GITHUB_WORKSPACE/xnu/patches/0130-sweet-gpu-memory-probe.patch"
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_memory_probe.cpp                      optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0131-sweet-pmap-highmem-cache-sync.patch"
          git -C dxb/xnu apply --reverse --check --exclude=iokit/Kernel/arm/sweet_gpu_hfi_memory.cpp --exclude=iokit/Kernel/arm/sweet_gpu_hfi_memory.h "$GITHUB_WORKSPACE/xnu/patches/0132-sweet-hfi-normal-nc-memory.patch"
          git -C dxb/xnu apply --reverse --check --exclude=bsd/conf/files --exclude=bsd/dev/sweet_smmu_context.c --exclude=bsd/dev/sweet_smmu_context.h "$GITHUB_WORKSPACE/xnu/patches/0133-sweet-smmu-context-lifetime.patch"
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_gpu_probe.c --exclude=bsd/dev/sweet_smmu_k6a.c --exclude=iokit/Kernel/arm/sweet_gpu_smmu_probe.cpp --exclude=iokit/conf/files.arm64 "$GITHUB_WORKSPACE/xnu/patches/0134-sweet-k6a-smmu-register-probe.patch"
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0135-sweet-smmu-preserve-fault-streams.patch"
          # 0136 adapter is superseded by 0138; final source cmp below is exact.
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0137-sweet-smmu-fault-type-check.patch"
          git -C dxb/xnu apply --reverse --check --exclude=iokit/Kernel/arm/sweet_gpu_smmu_probe.cpp "$GITHUB_WORKSPACE/xnu/patches/0138-sweet-smmu-inactive-unmatched-teardown.patch"
          # 0140 corrects the profile against Xiaomi's exact sweet_k6a tree.
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_gpu_hfi_table.c --exclude=bsd/dev/sweet_gpu_hfi_table.h --exclude=bsd/dev/sweet_gmu_layout.c --exclude=iokit/Kernel/arm/sweet_gmu_memory.cpp --exclude=iokit/Kernel/arm/sweet_gmu_memory.h --exclude=iokit/Kernel/arm/sweet_gpu_smmu_probe.cpp "$GITHUB_WORKSPACE/xnu/patches/0139-sweet-gmu-legacy-memory.patch"
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0140-sweet-k6a-stock-gmu-profile.patch"
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_hfi_transport.c --exclude=bsd/dev/sweet_hfi_transport.h "$GITHUB_WORKSPACE/xnu/patches/0141-sweet-hfi-stock-version-rx-request.patch"
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0142-sweet-command-db-snapshot.patch"
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET CMDDB: end bytes=' > /dev/null
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0143-sweet-gmu-execution-memory-latch.patch"
          git -C dxb/xnu apply --reverse --check --exclude=bsd/conf/files "$GITHUB_WORKSPACE/xnu/patches/0144-sweet-rpmh-inventory-hfi-bandwidth.patch"
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET TCS: end stable=" > /dev/null
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_gpu_probe.c "$GITHUB_WORKSPACE/xnu/patches/0145-sweet-gmu-bandwidth-handoff.patch"
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET BCM: ACK complete;" > /dev/null
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_gmu_start.c --exclude=bsd/dev/sweet_gmu_start.h --exclude=bsd/dev/sweet_gmu_start_profile.h --exclude=bsd/dev/sweet_gpu_probe.c --exclude=iokit/Kernel/arm/sweet_gpu_gmu_start.cpp "$GITHUB_WORKSPACE/xnu/patches/0146-sweet-gmu-first-cold-start.patch"
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_gmu_start.c --exclude=bsd/dev/sweet_gmu_start.h --exclude=bsd/dev/sweet_gpu_probe.c --exclude=iokit/Kernel/arm/sweet_gpu_gmu_start.cpp "$GITHUB_WORKSPACE/xnu/patches/0147-sweet-cm3-config-readback.patch"
          git -C dxb/xnu apply --reverse --check --exclude=iokit/Kernel/arm/sweet_gpu_gmu_start.cpp "$GITHUB_WORKSPACE/xnu/patches/0148-sweet-gmu-bus-cache-readback.patch"
          git -C dxb/xnu apply --reverse --check --exclude=bsd/dev/sweet_gmu_postboot.c --exclude=bsd/dev/sweet_gmu_postboot.h --exclude=iokit/Kernel/arm/sweet_gpu_gmu_start.cpp "$GITHUB_WORKSPACE/xnu/patches/0149-sweet-gmu-gx-hfi-start.patch"
          git -C dxb/xnu apply --reverse --check "$GITHUB_WORKSPACE/xnu/patches/0150-sweet-gmu-service-queue-health.patch"
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'dbg_queue=%u/%u observations=%u' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU HFI: begin GX and initial INIT/VERSION;" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU HFI: retained until reboot; PERF/BW/TEST" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: bus/cache read_mask=" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: CM3_CFG valid=" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: readback mismatch off=" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: fresh CM3 init BABEFACE;" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: all mappings retained until reboot;" > /dev/null
          for name in sweet_gpu_memory.cpp sweet_gpu_memory.h sweet_gpu_hfi_memory.cpp sweet_gpu_hfi_memory.h sweet_gpu_memory_probe.cpp sweet_gpu_smmu_probe.cpp sweet_gmu_memory.cpp sweet_gmu_memory.h sweet_gpu_gmu_start.cpp; do
            cmp "xnu/gpu/$name" "dxb/xnu/iokit/Kernel/arm/$name"
          done
          for name in sweet_smmu_context.c sweet_smmu_context.h sweet_smmu_k6a.c sweet_smmu_k6a.h sweet_gpu_pte.c sweet_gpu_pte.h sweet_gpu_tables.c sweet_gpu_tables.h sweet_gpu_hfi_table.c sweet_gpu_hfi_table.h sweet_gmu_layout.c sweet_gmu_layout.h sweet_hfi_codec.c sweet_hfi_codec.h sweet_hfi_transport.c sweet_hfi_transport.h sweet_hfi_bw.c sweet_hfi_bw.h sweet_gpu_probe.c sweet_gmu_start.c sweet_gmu_start.h sweet_gmu_start_profile.h sweet_hfi_perf.c sweet_hfi_perf.h; do
            cmp "xnu/gpu/$name" "dxb/xnu/bsd/dev/$name"
          done
          for name in sweet_gmu_postboot.c sweet_gmu_postboot.h sweet_gmu_postboot_profile.h sweet_gmu_arc.c sweet_gmu_arc.h; do
            cmp "xnu/gpu/$name" "dxb/xnu/bsd/dev/$name"
          done
          grep -Fx $'bsd/dev/sweet_gmu_postboot.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_gmu_arc.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_hfi_bw.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_smmu_context.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_gmu_layout.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gmu_memory.cpp                            optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_smmu_probe.cpp                        optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_gmu_start.cpp                         optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx $'bsd/dev/sweet_gmu_start.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_hfi_perf.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          find dxb/build/xnu.obj -name sweet_smmu_context.o -print | grep -F 'sweet_smmu_context.o' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET GPU SMMU: begin register-only test' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET GPU SMMU: legacy GMU memory SID5, 131 data pages, 6 tables' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'memory retained until reboot; no retry' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET GPU MEM: inactive HFI Normal-NC=' > /dev/null
          grep -F 'TCM prerequisites' dxb/xnu/bsd/dev/sweet_gpu_probe.c > /dev/null
          grep -F 'GMU TCM already attempted' dxb/xnu/bsd/dev/sweet_gpu_probe.c > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'TCM prerequisites' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'GMU TCM already attempted' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SMMU snapshot rc=' > /dev/null

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
