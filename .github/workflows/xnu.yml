          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'dbg_queue=%u/%u observations=%u' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU HFI: begin GX and initial INIT/VERSION;" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU HFI: retained until reboot; PERF/BW/TEST" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: bus/cache read_mask=" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: CM3_CFG valid=" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: readback mismatch off=" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: fresh CM3 init BABEFACE;" > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F "SWEET GMU BOOT: all mappings retained until reboot;" > /dev/null
          for name in sweet_gpu_memory.cpp sweet_gpu_memory.h sweet_gpu_hfi_memory.cpp sweet_gpu_hfi_memory.h sweet_gpu_memory_probe.cpp sweet_gpu_smmu_probe.cpp sweet_gmu_memory.cpp sweet_gmu_memory.h sweet_gpu_gmu_start.cpp; do
            cmp "xnu/gpu/$name" "dxb/xnu/iokit/Kernel/arm/$name"
          done
          for name in sweet_smmu_context.c sweet_smmu_context.h sweet_smmu_k6a.c sweet_smmu_k6a.h sweet_gpu_pte.c sweet_gpu_pte.h sweet_gpu_tables.c sweet_gpu_tables.h sweet_gpu_hfi_table.c sweet_gpu_hfi_table.h sweet_gmu_layout.c sweet_gmu_layout.h sweet_hfi_codec.c sweet_hfi_codec.h sweet_hfi_transport.c sweet_hfi_transport.h sweet_hfi_bw.c sweet_hfi_bw.h sweet_gpu_probe.c sweet_gmu_start.c sweet_gmu_start.h sweet_gmu_start_profile.h sweet_hfi_perf.c sweet_hfi_perf.h; do
            cmp "xnu/gpu/$name" "dxb/xnu/bsd/dev/$name"
          done
          for name in sweet_gmu_postboot.c sweet_gmu_postboot.h sweet_gmu_postboot_profile.h sweet_gmu_arc.c sweet_gmu_arc.h; do
            cmp "xnu/gpu/$name" "dxb/xnu/bsd/dev/$name"
          done
          grep -Fx $'bsd/dev/sweet_gmu_postboot.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_gmu_arc.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_hfi_bw.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_smmu_context.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_gmu_layout.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gmu_memory.cpp                            optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_smmu_probe.cpp                        optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx 'iokit/Kernel/arm/sweet_gpu_gmu_start.cpp                         optional iokitcpp' dxb/xnu/iokit/conf/files.arm64 > /dev/null
          grep -Fx $'bsd/dev/sweet_gmu_start.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          grep -Fx $'bsd/dev/sweet_hfi_perf.c\t\tstandard' dxb/xnu/bsd/conf/files > /dev/null
          find dxb/build/xnu.obj -name sweet_smmu_context.o -print | grep -F 'sweet_smmu_context.o' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET GPU SMMU: begin register-only test' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET GPU SMMU: legacy GMU memory SID5, 131 data pages, 6 tables' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'memory retained until reboot; no retry' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET GPU MEM: inactive HFI Normal-NC=' > /dev/null
          grep -F 'TCM prerequisites' dxb/xnu/bsd/dev/sweet_gpu_probe.c > /dev/null
          grep -F 'GMU TCM already attempted' dxb/xnu/bsd/dev/sweet_gpu_probe.c > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'TCM prerequisites' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'GMU TCM already attempted' > /dev/null
          strings dxb/fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SMMU snapshot rc=' > /dev/null

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  renderer:
    if: ${{ inputs.renderer_only && !inputs.wrapper_only && !inputs.compact_only }}
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa build tools
        run: brew install meson ninja bison flex
      - name: Build signed ARM64 iOS libraries
        run: |
          export PATH="$(brew --prefix flex)/bin:$PATH"
          bash tools/build-sweet-renderer.sh "$RUNNER_TEMP/sweet-renderer"
      - uses: actions/upload-artifact@v4
        with:
          name: sweet-ios16-renderer-arm64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sweet-renderer/sweet/lib/*.dylib
            ${{ runner.temp }}/sweet-renderer/CREDITS.md
            ${{ runner.temp }}/sweet-renderer/Mesa-license.rst
            ${{ runner.temp }}/sweet-renderer/SOURCES.txt
            ${{ runner.temp }}/sweet-renderer/SHA256SUMS

  wrapper:
    if: ${{ inputs.wrapper_only && !inputs.compact_only }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build signed ARM64 iOS backboardd launcher
        run: bash tools/build-sweet-backboard-wrapper.sh "$RUNNER_TEMP/sweet-wrapper"
      - uses: actions/upload-artifact@v4
        with:
          name: sweet-ios16-backboard-wrapper-arm64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sweet-wrapper/usr/libexec/backboardd
            ${{ runner.temp }}/sweet-wrapper/SHA256SUMS

  compact:
    if: ${{ inputs.compact_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch and verify the selected kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/kernel" "$RUNNER_TEMP/compact"
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
            -n xnu-kernel -D "$RUNNER_TEMP/kernel"
          cd "$RUNNER_TEMP/kernel"
          grep -E '^[0-9a-f]{64}  kernel\.development\.sweet$' SHA256SUMS | sha256sum -c -
          test -s kernel.development.sweet
          cp kernel.development.sweet "$RUNNER_TEMP/compact/"
      - name: Compress development kernel
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/compact"
          sha256sum kernel.development.sweet > SHA256SUMS
          xz -T2 -6 kernel.development.sweet
          sha256sum kernel.development.sweet.xz > COMPRESSED-SHA256SUMS
          ls -lh kernel.development.sweet.xz
      - uses: actions/upload-artifact@v4
        with:
          name: sweet-compact-development-kernel
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/compact/kernel.development.sweet.xz
            ${{ runner.temp }}/compact/SHA256SUMS
            ${{ runner.temp }}/compact/COMPRESSED-SHA256SUMS
